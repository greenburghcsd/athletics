name: Refresh athletics schedule
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch: {}
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start from the last published schedule
        run: curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/schedule.json" -o data/schedule.json || echo "no published copy yet; using the seed"
      - name: Pull the portal
        run: node src/refresh.mjs --once
        continue-on-error: true
      - name: Add the weather forecast
        run: node src/weather.mjs
        continue-on-error: true
      - run: node tools/build-static.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
